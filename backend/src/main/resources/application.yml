server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: expense-voucher
  datasource:
    url: jdbc:postgresql://localhost:5432/expense_voucher
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIMEZONE:Asia/Kolkata}
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-key-to-a-long-random-string-32b}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload-dir: ${UPLOAD_DIR:uploads}
  max-signature-bytes: ${MAX_FILE_SIZE_BYTES:2097152}
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.abc.expensevoucher: INFO
