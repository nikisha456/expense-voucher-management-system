services:
  postgres:
    image: postgres:17
    container_name: expenseflow-db
    environment:
      POSTGRES_DB: expense_voucher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - expenseflow_pg:/var/lib/postgresql/data

volumes:
  expenseflow_pg:
